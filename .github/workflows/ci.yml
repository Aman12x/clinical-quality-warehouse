name: ci
on: [push, pull_request]
jobs:
  warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv -r requirements.txt
      - run: make data
      - run: make load build reconcile
