version: 2
models:
  - name: stg_patients
    columns:
      - name: patient_id
        tests: [unique, not_null]
      - name: birth_date
        tests: [not_null]
  - name: stg_encounters
    columns:
      - name: encounter_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_patients'), field: patient_id}
      - name: encounter_class
        tests:
          - accepted_values:
              arguments:
                values: [ambulatory, emergency, inpatient, outpatient, urgentcare, wellness]
  - name: stg_conditions
    columns:
      - name: patient_id
        tests:
          - relationships:
              arguments: {to: ref('stg_patients'), field: patient_id}
  - name: stg_observations
    columns:
      - name: loinc_code
        tests: [not_null]
